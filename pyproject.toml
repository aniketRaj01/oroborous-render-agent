[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "render-agent"
version = "0.0.0.dev0"
description = "GPU render agent for the Oroborous content pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.scripts]
render-agent = "render_agent.__main__:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3,ssm]>=1.35",
    "moto[s3]>=5.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "shellcheck-py>=0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/render_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "deploy", "model_server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT018"]
"scripts/**" = ["S"]
"deploy/**" = ["S"]
"model_server/**" = ["S"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts", "deploy", "model_server"]
mypy_path = "deploy:scripts:tests:model_server:model_server/tools"
python_version = "3.10"

[[tool.mypy.overrides]]
# torch, LTX-2, av and numpy exist only in the GPU instance's LTX virtualenv; they are imported lazily.
module = ["torch", "torch.*", "ltx_core", "ltx_core.*", "ltx_pipelines", "ltx_pipelines.*", "av", "numpy"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["tests", "deploy", "scripts", "model_server", "model_server/tools"]
